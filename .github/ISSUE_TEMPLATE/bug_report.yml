name: Bug report
description: Report a reproducible JK Bridge problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove hostnames, tailnet names, usernames, IPs, public keys, tokens, and personal paths. Report security issues privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: JK Bridge version
      placeholder: v2.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Linux distribution, Tailscale version, and OpenSSH version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: List the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted diagnostics
      description: Never paste pairing codes, private keys, config.json, raw Tailscale JSON, or authorized_keys.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed deployment identity, credentials, keys, tokens, and personal paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
