name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Source and security release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install release-scan dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Public-release privacy scan
        run: ./scripts/check-public-release.sh
      - name: Documentation link check
        run: ./scripts/check-doc-links.sh
      - name: Agent package contract check
        run: ./scripts/check-agent-package.sh
      - name: Python helper and Agent tests
        run: python3 -m unittest discover -s tests/linux -p 'test_*.py'
      - name: Agent security regression tests
        run: python3 -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Portable service-profile privacy tests
        run: dotnet test JKBridge.slnx -c Release --nologo --filter FullyQualifiedName~ServiceProfileTests
      - name: .NET tests
        run: dotnet test JKBridge.slnx -c Release --no-restore --nologo
      - name: Release build with warnings as errors
        run: dotnet build JKBridge.slnx -c Release --no-restore --nologo -warnaserror

  portable-package:
    name: Build portable Windows ZIP
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install release-scan dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build verified package
        run: ./scripts/publish-win-x64.sh
      - uses: actions/upload-artifact@v7
        with:
          name: JKBridge-win-x64
          path: |
            artifacts/JKBridge-win-x64.zip
            artifacts/JKBridge-win-x64.zip.sha256
          if-no-files-found: error
  installer-package:
    name: Compile optional unsigned Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Fetch pinned Inno Setup Simplified Chinese messages
        uses: actions/checkout@v7
        with:
          repository: jrsoftware/issrc
          ref: cfdf48923178df4b4f040e038b423aa555a61ffc
          path: .inno-setup-source
          sparse-checkout: Files/Languages/Unofficial/ChineseSimplified.isl
          sparse-checkout-cone-mode: false
      - name: Build with warnings as errors
        shell: pwsh
        run: dotnet build JKBridge.slnx -c Release --nologo -warnaserror
      - name: Compile installer without signing credentials
        shell: pwsh
        run: .\scripts\build-installer.ps1 -ChineseMessagesFile "$env:GITHUB_WORKSPACE\.inno-setup-source\Files\Languages\Unofficial\ChineseSimplified.isl"
      - uses: actions/upload-artifact@v7
        with:
          name: JKBridge-Setup-win-x64-unsigned
          path: |
            artifacts/installer/output/*.exe
            artifacts/installer/output/*.sha256
          if-no-files-found: error

  tagged-release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - portable-package
      - installer-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Publish stable or preview release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/release/JKBridge-win-x64.zip
            artifacts/release/JKBridge-win-x64.zip.sha256
            artifacts/release/JKBridge-Setup-win-x64-*.exe
            artifacts/release/JKBridge-Setup-win-x64-*.exe.sha256
