name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install release-scan dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build verified package
        run: ./scripts/publish-win-x64.sh
      - uses: actions/upload-artifact@v7
        with:
          name: JKBridge-win-x64
          path: |
            artifacts/JKBridge-win-x64.zip
            artifacts/JKBridge-win-x64.zip.sha256
          if-no-files-found: error
      - name: Attach tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/JKBridge-win-x64.zip
            artifacts/JKBridge-win-x64.zip.sha256
