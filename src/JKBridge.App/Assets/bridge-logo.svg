  <path d="M32 31H96" stroke="url(#bridge)" stroke-width="2" stroke-linecap="round" opacity="0.42"/>

  <rect x="8" y="17" width="25" height="25" rx="7.5" fill="#121A21" stroke="#7D79F2" stroke-width="2"/>
  <rect x="95" y="17" width="25" height="25" rx="7.5" fill="#121A21" stroke="#39B8AE" stroke-width="2"/>
